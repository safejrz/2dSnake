<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<style>
    h1 {
        text-shadow: 10px 10px 0 rgba(0, 0, 0, 0);
        transition: all 0.9s;
    }

    html {
        margin: 20px;
    }

    .scoreLabel {
        font-weight: bolder;
        color: red;
        text-align: right;
    }

    .image {
        border: none;
        position: relative;
        z-index: -1;
    }

    .playarea {
        margin-top: -300px;
        border: 1px solid black;
        background-color: green;
        transition: all 0.2s;
    }

    .playarea.gameover {
        margin-top: -300px;
        position: relative;
        border: none;
        background-color: transparent;
        transition: all 1s;
    }

    .container {
        display: inline-block;
        width: 300;
        height: 300;
        position: relative;
    }

    .title {
        font-family: sans-serif;
        display: flex;
        color: black;
    }

    .instructions {
        font-style: italic;
    }

    html, body {
        overscroll-behavior: none;
    }

    .playarea {
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        max-width: 100%;
    }

    .controls {
        display: none;
        margin-top: 16px;
        user-select: none;
        -webkit-user-select: none;
        touch-action: manipulation;
    }

    .controls .row {
        display: flex;
        justify-content: center;
        gap: 8px;
        margin-bottom: 8px;
    }

    .controls button {
        width: 72px;
        height: 72px;
        font-size: 28px;
        border-radius: 12px;
        border: 2px solid black;
        background: #ffe;
        touch-action: manipulation;
    }

    .controls button.restart {
        width: auto;
        padding: 0 20px;
        font-size: 18px;
        height: 48px;
    }

    .touch-only { display: none; }

    @media (pointer: coarse) {
        .controls { display: block; width: 300px; }
        .touch-only { display: inline; }
        .keyboard-only { display: none; }
    }
</style>
<div class="title">
    <h1>RETRO SNAKE ❗❗❗</h1>
</div>

<body>
    <label class="scoreLabel">Score:</label>
    <p></p>
    <div class="container">
        <img class="image" src="Meme.gif" width="300" height="300" />
        <canvas width="300" height="300" class="playarea"></canvas>
    </div>
    <br />
    <br />
    <p class="instructions">
        <span class="keyboard-only">Use the <b>ARROWS to MOVE</b> the snake to the food.<br />
        Use <b>SPACE to RESTART</b> the game.</span>
        <span class="touch-only"><b>SWIPE</b> on the game or use the <b>D-PAD</b> to move the snake to the food.<br />
        Tap the game after Game Over or use <b>RESTART</b>.</span>
    </p>
    <div class="controls">
        <div class="row"><button data-dir="up" aria-label="Up">▲</button></div>
        <div class="row">
            <button data-dir="left" aria-label="Left">◄</button>
            <button data-dir="down" aria-label="Down">▼</button>
            <button data-dir="right" aria-label="Right">►</button>
        </div>
        <div class="row"><button class="restart" data-action="restart">Restart</button></div>
    </div>
</body>

<script>
    const scale = 10;
    const emojiSize = 2;
    let xPadding = 0;
    let level = 0;
    let score = 0;
    let direction = [1, 0];
    let snake = [[6, 4], [5, 4], [4, 4]];
    let foodCoords = [];
    let foodEmoji;
    let refreshInterval = 250; // decreasing should increase speed

    const canvas = document.querySelector('.playarea');
    let ctx = canvas.getContext('2d');
    ctx.scale(scale, scale);
    const maxX = canvas.width / scale;
    const maxY = canvas.height / scale;

    let gameInterval;
    let titleInterval;

    const pendingDirs = [];
    let gameIsOver = false;

    function setDirection(dx, dy) {
        const last = pendingDirs.length ? pendingDirs[pendingDirs.length - 1] : direction;
        if (last[0] === -dx && last[1] === -dy) {
            return; // can't reverse onto itself
        }
        if (last[0] === dx && last[1] === dy) {
            return;
        }
        if (pendingDirs.length < 3) {
            pendingDirs.push([dx, dy]);
        }
    }

    function move(e) {
        switch (e.key) {
            case ' ':
                e.preventDefault();
                restartGame();
                break;
            case 'ArrowLeft':
                e.preventDefault();
                setDirection(-1, 0);
                break;
            case 'ArrowUp':
                e.preventDefault();
                setDirection(0, -1);
                break;
            case 'ArrowRight':
                e.preventDefault();
                setDirection(1, 0);
                break;
            case 'ArrowDown':
                e.preventDefault();
                setDirection(0, 1);
                break;
            default:
                break;
        }
    }

    const dirVectors = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
    const swipeThreshold = 30;
    let touchStart = null;

    canvas.addEventListener('pointerdown', e => {
        if (gameIsOver) {
            restartGame();
            return;
        }
        touchStart = { id: e.pointerId, x: e.clientX, y: e.clientY };
        canvas.setPointerCapture(e.pointerId);
    });

    canvas.addEventListener('pointermove', e => {
        if (!touchStart || touchStart.id !== e.pointerId) return;
        const dx = e.clientX - touchStart.x;
        const dy = e.clientY - touchStart.y;
        if (Math.max(Math.abs(dx), Math.abs(dy)) < swipeThreshold) return;
        if (Math.abs(dx) > Math.abs(dy)) {
            setDirection(Math.sign(dx), 0);
        } else {
            setDirection(0, Math.sign(dy));
        }
        touchStart = { id: e.pointerId, x: e.clientX, y: e.clientY }; // allow chained swipes
    });

    ['pointerup', 'pointercancel'].forEach(t =>
        canvas.addEventListener(t, () => { touchStart = null; }));

    document.querySelector('.controls').addEventListener('pointerdown', e => {
        const btn = e.target.closest('button');
        if (!btn) return;
        e.preventDefault();
        if (btn.dataset.action === 'restart') {
            restartGame();
        } else {
            const v = dirVectors[btn.dataset.dir];
            setDirection(v[0], v[1]);
        }
    });

    function stopGame() {
        clearInterval(titleInterval);
        clearInterval(gameInterval);
    }

    function gameOver() {
        stopGame();
        gameIsOver = true;
        canvas.classList.add('gameover');
        displayGameOver();
        clearShadowTitle();
        xPadding = 1;
        let now = new Date();
        console.log(`Game Over :( ${now.getHours()}:${now.getMinutes()}:${now.getSeconds()}`);
    }

    function startGame() {
        canvas.classList.remove('gameover');
        clearPlayArea();
        resumeGame();
    }

    function resumeGame() {
        let now = new Date();
        console.log(`Game started ${now.getHours()}:${now.getMinutes()}:${now.getSeconds()}`);
        displayScore();
        generateNextFood();
        titleInterval = setInterval(moveShadowTitle, 1000);
        gameInterval = setInterval(validateSnake, refreshInterval);
    }

    function restartGame() {
        stopGame();
        resetVariables();
        startGame();
    }

    function resetVariables() {
        gameIsOver = false;
        pendingDirs.length = 0;
        level = 0;
        score = 0;
        direction = [1, 0];
        snake = [[6, 4], [5, 4], [4, 4]];
        foodCoords = [];
        refreshInterval = 250; // decreasing value will increase speed
    }

    function validateSnake() {
        if (pendingDirs.length) {
            direction = pendingDirs.shift();
        }
        const nextX = snake[0][0] + direction[0];
        const nextY = snake[0][1] + direction[1];

        if (snake.find(([x, y]) => x == nextX && y == nextY) || //snake eating itself!
            ((nextX >= maxX || nextX <= -1) || (nextY >= maxY || nextY <= -1)) //snake out of play area!
        ) {
            return gameOver();
        }

        snake.unshift([nextX, nextY]); // add new element to the snake

        // Food behavior
        if (nextX == foodCoords[0] && nextY == foodCoords[1]
            || nextX == foodCoords[0] + 1 && nextY == foodCoords[1]
            || nextX == foodCoords[0] && nextY == foodCoords[1] + 1
            || nextX == foodCoords[0] + 1 && nextY == foodCoords[1] + 1
        ) {
            stopGame();
            level++;
            if (level < 15) {
                refreshInterval = Math.round(refreshInterval * 0.87);
            }
            resumeGame();
        } else {
            snake.pop(); // dispose of the last element
        }

        //draw next game frame
        displaySnake();
        displayFood();
    }

    function displaySnake() {
        clearPlayArea();
        ctx.fillStyle = "yellow";
        snake.forEach(([x, y]) => { ctx.fillRect(x, y, 1, 1) });
    }

    function clearPlayArea() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    function generateNextFood() {
        foodEmoji = getRandomFoodEmoji();
        console.log(foodEmoji);
        do {
            foodCoords = [Math.round(Math.random() * (maxX - emojiSize - xPadding)), Math.round(Math.random() * (maxY - emojiSize))];
        }
        while (snake.find(([x, y]) => x == foodCoords[0] && y == foodCoords[1]
            || x == foodCoords[0] + 1 && y == foodCoords[1]
            || x == foodCoords[0] && y == foodCoords[1] + 1
            || x == foodCoords[0] + 1 && y == foodCoords[1] + 1));

        displayFood();
    }

    function getRandomFoodEmoji() {
        const fruitNumber = Math.ceil(Math.random() * (44));
        switch (fruitNumber) {
            //fruits
            case 1:
                return "🍇";
            case 2:
                return "🍈";
            case 3:
                return "🍉";
            case 4:
                return "🍊";
            case 5:
                return "🍋";
            case 6:
                return "🍌";
            case 7:
                return "🍍";
            case 8:
                return "🥭";
            case 9:
                return "🍎";
            case 10:
                return "🍏";
            case 11:
                return "🍐";
            case 12:
                return "🍑";
            case 13:
                return "🍒";
            case 14:
                return "🍓";
            case 15:
                return "🥝";
            case 16:
                return "🍅";
            case 17:
                return "🥥";
            //vegetables
            case 18:
                return "🥕";
            case 19:
                return "🥔";
            case 20:
                return "🥦";
            case 21:
                return "🍄";
            //snacks
            case 22:
                return "🌮";
            case 23:
                return "🥪";
            case 24:
                return "🌯";
            case 25:
                return "🌭";
            case 26:
                return "🍕";
            case 27:
                return "🍝";
            case 28:
                return "🥡";
            case 29:
                return "🥟";
            //meat
            case 30:
                return "🥩";
            case 31:
                return "🥓";
            case 32:
                return "🍗";
            //bread
            case 33:
                return "🥨";
            case 34:
                return "🍩";
            case 35:
                return "🍪";
            case 36:
                return "🍰";
            case 37:
                return "🧁";
            case 38:
                return "🍫";
            case 39:
                return "🍦";
            //seafood
            case 40:
                return "🍤";
            case 41:
                return "🦑";
            case 42:
                return "🦞";
            case 43:
                return "🦀";
            case 44:
                return "🍣";
            default:
                return "💩";
        }
    }

    function moveShadowTitle() {
        const title = document.querySelector('.title');
        const text = title.querySelector('h1');
        const walk = 40;

        let now = new Date();
        let seconds = now.getSeconds();
        if (seconds > 30) {
            seconds = 30 - (seconds - 30);
        }

        let negativeSeconds = -1 * seconds;

        const { offsetWidth: width, offsetHeight: height } = title;
        const xWalk = Math.round((seconds / width * walk) + (walk / 20)); //- (walk / 2)
        const yWalk = Math.round((negativeSeconds / height * walk) + (walk / 10)); //- (walk / 2)
        const xNWalk = -1.2 * Math.round((seconds / width * walk) - (walk / 10));
        const yNWalk = -1 * Math.round((negativeSeconds / height * walk) - (walk / 20));

        text.style.textShadow = `
      ${xWalk}px ${yWalk}px 0 rgba(255, 255, 0, .7),
      ${yWalk}px ${xWalk}px 0 rgba(0, 255, 0, .7),
      ${yNWalk}px ${xNWalk}px 0 rgba(0, 255, 255, .7),
      ${xNWalk}px ${Math.round(yNWalk / 2)}px 0 rgba(255, 0, 255, .7)
      `;
    }

    function clearShadowTitle() {
        const title = document.querySelector('.title');
        const text = title.querySelector('h1');
        text.style.textShadow = "10px 10px 0 rgba(0, 0, 0, 0)";
    }

    function displayScore() {
        const scoreText = document.querySelector('.scoreLabel');
        if (level <= 1) {
            score = level * 100;
        } else {
            score = Math.round(score * 1.1 + 100);
        }

        scoreText.innerText = `Score:${score}`;
    }

    function displayFood() {
        ctx.font = `${emojiSize}px Arial`;
        ctx.textBaseline = "middle";
        //displayWhiteRectangle(); // uncomment to debbug for padding errors.
        ctx.fillText(foodEmoji, foodCoords[0] + xPadding, foodCoords[1] + 1, emojiSize);
    }

    function displayWhiteRectangle() {
        ctx.fillStyle = "rgb(255, 255, 255)";
        ctx.fillRect(foodCoords[0], foodCoords[1], emojiSize, emojiSize)
    }

    function displayGameOver() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.font = "4px Arial Black";
        ctx.fillStyle = "rgb(255, 255, 0)";
        ctx.textAlign = "center";
        ctx.fillText("Game Over!", Math.ceil(maxX/2), Math.ceil(23));
        ctx.font = "4.1px Arial Black";
        ctx.fillStyle = "rgb(255, 0, 0)";
        ctx.textAlign = "center";
        ctx.fillText("Game Over!", Math.ceil(maxX/2), Math.ceil(23));
    }

    document.addEventListener("keydown", move);
    startGame();
</script>
